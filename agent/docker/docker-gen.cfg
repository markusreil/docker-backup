# Two watched templates: the backend-agnostic list of volumes to back up,
# and the supercronic crontab (one snapshot-volume line per volume).
# The crontab stanza signals supercronic to reload after every regen.

[[config]]
template = "/etc/backup-agent/templates/volumes.yaml.tmpl"
dest = "/state/volumes.yaml"
watch = true
wait = "500ms:2s"

[[config]]
template = "/etc/backup-agent/templates/crontab.tmpl"
dest = "/state/crontab"
watch = true
wait = "500ms:2s"
notifycmd = "/etc/backup-agent/reload-crontab"
